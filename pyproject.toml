[project]
name = "sarah-constraint-solver"
version = "0.1.0"
description = "Assign mentoring peer groups to class-split groups, one session per group and topic, in an Excel workbook."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
